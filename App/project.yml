name: ProFootballCoach
options:
  bundleIdPrefix: com.ericmg
  deploymentTarget: { iOS: "26.0" }
  createIntermediateGroups: true
packages:
  ProFootballCoach:
    path: ..
targets:
  ProFootballCoach:
    type: application
    platform: iOS
    sources: [ProFootballCoachApp.swift, PrivacyInfo.xcprivacy]
    dependencies:
      - package: ProFootballCoach
        product: FootballSimCore
      - package: ProFootballCoach
        product: ProFootballCoachUI
      - package: ProFootballCoach
        product: CoachWorldApp
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Landscape only, both ways up. Owner decision 2026-08-10 (04 section 5.2): landscape is
        # what fits the whole 120-yard field in frame at once with no camera pan. The audit's
        # orientation findings all traced back to this one line being absent, not to which
        # orientation it named - every screen was rotatable and two of them lost their controls
        # off the bottom edge when they were. One declared orientation is the property that
        # matters. OrientationPolicyTest reads this file, so it cannot drift from 04.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Pro Football Coach"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        # Forge Field ships three families (04 6.2a). The app is offline, so the binaries are
        # bundled rather than fetched; each ships beside its OFL licence, and the Forge Field
        # font contract test reads this list rather than a hand-maintained copy of it.
        INFOPLIST_KEY_UIAppFonts: "Fonts/SairaCondensed-Regular.ttf Fonts/SairaCondensed-Medium.ttf Fonts/SairaCondensed-SemiBold.ttf Fonts/SairaCondensed-Bold.ttf Fonts/Figtree-Regular.ttf Fonts/Figtree-Medium.ttf Fonts/Figtree-SemiBold.ttf Fonts/JetBrainsMono-Regular.ttf Fonts/JetBrainsMono-Medium.ttf Fonts/JetBrainsMono-Bold.ttf"
  ProFootballCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources: [../Tests/ProFootballCoachTests/ProFootballCoachTests.swift]
    dependencies:
      - target: ProFootballCoach
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
  ProFootballCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [../Tests/ProFootballCoachUITests/ProFootballCoachUITests.swift]
    dependencies:
      - target: ProFootballCoach
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ProFootballCoach:
    build:
      targets:
        ProFootballCoach: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProFootballCoachTests
        - ProFootballCoachUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  ProFootballCoachRelease:
    build:
      targets:
        ProFootballCoach: all
        ProFootballCoachTests: [test]
        ProFootballCoachUITests: [test]
    test:
      config: Release
      targets:
        - ProFootballCoachTests
